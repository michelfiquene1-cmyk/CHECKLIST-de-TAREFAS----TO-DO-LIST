<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Organize sua rotina com um checklist simples, acessível e com salvamento no navegador.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="card">

        <div class="tape" aria-hidden="true"></div>

        <header>
            <h1>Checklist</h1>
            <span id="contador" aria-live="polite">0 de 0 feitas</span>
        </header>

        <form id="formulario-tarefa">
            <label class="sr-only" for="campo-tarefa">Nova tarefa</label>

            <input
                type="text"
                placeholder="O que eu preciso fazer?"
                id="campo-tarefa"
                maxlength="200"
                aria-describedby="mensagem"
                autocomplete="off"
            />

            <button type="submit" id="botao-adicionar">
                Adicionar
            </button>

        </form>

        <div class="armazenamento">
            <label for="modo">Salvar tarefas:</label>
            <select id="modo">
                <option value="local">Neste navegador</option>
                <option value="api">Na API existente</option>
            </select>
        </div>
        <p id="status-api"></p>
        <button id="recarregar" type="button" hidden>Recarregar API</button>
        <div class="filtros" role="group" aria-label="Filtrar tarefas">
            <button type="button" data-filtro="todas" aria-pressed="true">Todas</button>
            <button type="button" data-filtro="pendentes" aria-pressed="false">Pendentes</button>
            <button type="button" data-filtro="concluidas" aria-pressed="false">Concluídas</button>
        </div>
        <p id="mensagem" role="status" aria-live="polite" aria-atomic="true"></p>

        <ul id="lista-tarefas">
            <li class="carregando">Carregando tarefas...</li>
        </ul>

    </main>
    <noscript>Ative o JavaScript para usar o checklist.</noscript>

    <script src="script.js"></script>

</body>

</html>
